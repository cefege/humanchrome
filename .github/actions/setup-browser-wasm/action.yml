name: Set up numeric browser WASM tooling
description: Install the repository-pinned Rust toolchain and numeric WASM build tool.
runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain and targets
      shell: bash
      run: rustup show active-toolchain
    - name: Install SIMD build tool
      shell: bash
      run: |
        set -euo pipefail
        if command -v wasm-pack && [[ "$(wasm-pack --version)" == 'wasm-pack 0.15.0' ]]; then
          echo 'Using wasm-pack 0.15.0'
        else
          cargo install wasm-pack --version 0.15.0 --locked
        fi
