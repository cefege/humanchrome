name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# See ci.yml: the extension's canonical ID is pinned by the Web Store item,
# not a repo-held key, so the release zip is built keyless. Opt the
# wxt.config.ts keyless-build guard out here. To publish a keyed zip, set the
# CHROME_EXTENSION_KEY repo secret, pass it into the build step, drop this flag.
env:
  HC_ALLOW_KEYLESS_BUILD: '1'

jobs:
  release:
    name: Build extension zip and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm build

      - name: Zip the unpacked extension
        working-directory: app/chrome-extension
        run: |
          cd .output
          zip -r ../humanchrome-extension-${GITHUB_REF_NAME}.zip chrome-mv3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            app/chrome-extension/humanchrome-extension-*.zip
