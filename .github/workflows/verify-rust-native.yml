name: Verify Rust Native Platform

on:
  push:
    branches: [verify/rust-native-platform-20261029-9c8bde9e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-core:
    name: Native core windows-x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout frozen native candidate
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Select complete Strawberry Perl for vendored OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          choco.exe install strawberryperl nasm --no-progress --yes
          printf '%s\n' 'OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe' >> "$GITHUB_ENV"
          printf '%s\n' 'C:/Strawberry/perl/bin' 'C:/Strawberry/c/bin' >> "$GITHUB_PATH"
          'C:/Strawberry/perl/bin/perl.exe' -MLocale::Maketext::Simple -e 1
          command -v nasm
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc
      - name: Restore native compilation cache
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verify-native-windows-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: verify-native-windows-1.99.1-${{ hashFiles('Cargo.lock') }}-
      - name: Create verification logs
        shell: bash
        run: mkdir -p native-logs
      - name: Build public native executables
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target x86_64-pc-windows-msvc -p humanchrome-native \
            --bin humanchrome-nativehost --bin humanchrome-bridge --bin humanchrome-stdio \
            2>&1 | tee native-logs/build.log
      - name: Run workspace unit tests excluding unfinished WASM facade
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --target x86_64-pc-windows-msvc --workspace --exclude humanchrome-wasm 2>&1 | tee native-logs/workspace-tests.log
      - name: Run core browser policy unit suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --target x86_64-pc-windows-msvc -p humanchrome-core --features browser 2>&1 | tee native-logs/core-browser-tests.log
      - name: Package Windows core archive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-native-release.mjs --target x86_64-pc-windows-msvc \
            --bin-dir target/x86_64-pc-windows-msvc/release --output-dir native-artifacts \
            2>&1 | tee native-logs/package.log
      - name: Preserve compiled candidate before runtime smoke
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Smoke installed Windows archive without Node on child PATH
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          node scripts/smoke-native-release.mjs \
            --archive "native-artifacts/humanchrome-native-${version}-x86_64-pc-windows-msvc.zip" \
            2>&1 | tee native-logs/smoke.log
      - name: Upload core archive and checksums
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: native-core-windows-x86_64-${{ github.sha }}
          path: native-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-core-logs-windows-x86_64-${{ github.sha }}
          path: native-logs/*
          if-no-files-found: error
          retention-days: 14
