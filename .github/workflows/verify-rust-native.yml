name: Verify Rust Native Platform

on:
  push:
    branches: [verify/rust-native-platform-20261029-9c8bde9e]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-core:
    name: Native core ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - id: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - id: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - id: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout verification candidate
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install vendored OpenSSL prerequisites
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              sudo apt-get install --yes build-essential perl pkg-config
              ;;
            macOS)
              command -v perl
              command -v make
              command -v clang
              ;;
            Windows)
              choco.exe install strawberryperl nasm --no-progress --yes
              printf '%s\n' 'OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe' >> "$GITHUB_ENV"
              printf '%s\n' 'C:/Strawberry/perl/bin' 'C:/Strawberry/c/bin' >> "$GITHUB_PATH"
              'C:/Strawberry/perl/bin/perl.exe' -MLocale::Maketext::Simple -e 1
              command -v nasm
              ;;
            *)
              echo "unsupported runner OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Restore native compilation cache
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verify-native-${{ runner.os == 'Windows' && 'windows' || matrix.id }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: verify-native-${{ runner.os == 'Windows' && 'windows' || matrix.id }}-1.99.1-${{ hashFiles('Cargo.lock') }}-

      - name: Create verification logs
        shell: bash
        run: mkdir -p native-logs

      - name: Build public native executables
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}" -p humanchrome-native \
            --bin humanchrome-nativehost \
            --bin humanchrome-bridge \
            --bin humanchrome-stdio 2>&1 | tee native-logs/build.log

      - name: Run workspace unit tests on the native target
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --target "${{ matrix.target }}" --workspace --all-features 2>&1 | tee native-logs/workspace-tests.log

      - name: Run core browser policy unit suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --target "${{ matrix.target }}" -p humanchrome-core --features browser 2>&1 | tee native-logs/core-browser-tests.log

      - name: Package core native archive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-native-release.mjs \
            --target "${{ matrix.target }}" \
            --bin-dir "target/${{ matrix.target }}/release" \
            --output-dir native-artifacts 2>&1 | tee native-logs/package.log

      - name: Preserve compiled candidate before runtime smoke
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Smoke packaged core release without Node on child PATH
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          extension='tar.gz'
          if [[ "${{ matrix.target }}" == *windows* ]]; then extension='zip'; fi
          node scripts/smoke-native-release.mjs \
            --archive "native-artifacts/humanchrome-native-${version}-${{ matrix.target }}.${extension}" \
            2>&1 | tee native-logs/smoke.log

      - name: Create isolated Docker context and verify coordinator image
        if: matrix.id == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          context="hc-isolated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="humanchrome-coordinator-verify:${GITHUB_SHA}"
          prefix="${RUNNER_TEMP}/hc-mcp-sdk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker context rm --force "$context" || true
            rm -rf "$prefix"
          }
          trap cleanup EXIT
          docker context create "$context" --docker "host=unix:///var/run/docker.sock"
          docker --context "$context" build --file Dockerfile.coordinator --tag "$image" . 2>&1 | tee native-logs/coordinator-image.log
          npm install --prefix "$prefix" --ignore-scripts --no-save @modelcontextprotocol/client@2.4.0
          NODE_PATH="$prefix/node_modules" node scripts/verify-coordinator-container.mjs \
            --context "$context" \
            --image "$image" \
            --machine-label physical-x86_64 \
            --timeout-seconds 180 2>&1 | tee native-logs/coordinator-container.log

      - name: Upload core archive and checksums
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: native-core-${{ matrix.id }}-${{ github.sha }}
          path: native-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-core-logs-${{ matrix.id }}-${{ github.sha }}
          path: native-logs/*
          if-no-files-found: error
          retention-days: 14
